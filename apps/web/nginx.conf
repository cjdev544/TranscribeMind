server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default mime.types has no entry for this extension, so it
    # falls back to application/octet-stream — some browsers refuse to treat
    # a manifest with the wrong content-type as installable. Scoped to this
    # one location only, so it doesn't clobber the mime type table for
    # every other static file served by this server block.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # The service worker must never be served from a stale cache, or clients
    # could get stuck on an old version of itself indefinitely.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # React Router uses client-side routing — any path that isn't a real
    # static file must fall back to index.html, or refreshing on a deep
    # link (e.g. /dashboard) returns nginx's 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
