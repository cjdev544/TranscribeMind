services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcribemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcribemind}
      POSTGRES_DB: ${POSTGRES_DB:-transcribemind}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transcribemind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      S3_BUCKET: ${S3_BUCKET:-transcribemind-videos}
      # Tested: even with this set, LocalStack Community does NOT reliably
      # survive a container restart (the bucket itself disappears) — its
      # automatic persistence needs LocalStack Pro / Cloud Pods. Treat this
      # as "good enough for local dev", never as real storage for a demo
      # that has to survive a redeploy or server reboot. Use a real
      # S3-compatible bucket (e.g. Cloudflare R2, free tier) for that.
      PERSISTENCE: 1
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh

  gateway-api:
    build:
      context: .
      dockerfile: apps/gateway-api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-transcribemind}:${POSTGRES_PASSWORD:-transcribemind}@postgres:5432/${POSTGRES_DB:-transcribemind}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://localstack:4566
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_started

  video-worker:
    build:
      context: .
      dockerfile: apps/video-worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-transcribemind}:${POSTGRES_PASSWORD:-transcribemind}@postgres:5432/${POSTGRES_DB:-transcribemind}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_started

  ai-summary-service:
    build:
      context: .
      dockerfile: apps/ai-summary-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-transcribemind}:${POSTGRES_PASSWORD:-transcribemind}@postgres:5432/${POSTGRES_DB:-transcribemind}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "5173:80"
    depends_on:
      - gateway-api

volumes:
  postgres-data:
  localstack-data:
